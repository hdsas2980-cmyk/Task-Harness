<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Harness Visualizer</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--panel2:#18233b;--line:#2b3a5d;--text:#e8eefc;--muted:#9eadd0;--accent:#7dd3fc;--good:#5ee7a5;--warn:#f7c873;--bad:#ff7d91;--shadow:0 12px 35px #0004}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1a2d53 0,#0b1020 42%);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer}button:hover{border-color:var(--accent)}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.title h1{margin:0;font-size:27px}.title p{margin:6px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.load{margin:20px 0;padding:18px;border:1px dashed #526b9c;border-radius:12px;background:#101a30}.load.drag{border-color:var(--accent);background:#173253}.loadline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.hint{color:var(--muted);font-size:12px;margin-top:8px}.status{margin-top:9px;color:var(--muted);min-height:20px}.stats{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:10px;margin-bottom:18px}.stat,.panel{background:linear-gradient(145deg,#141f37,#10182b);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.stat{padding:13px}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.8fr);gap:16px}.panel{padding:16px}.panel h2{font-size:16px;margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{background:#0b1326;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px}.tasks{display:grid;gap:9px}.task{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:9px;padding:12px;background:#10192d}.task[data-status=passed]{border-left-color:var(--good)}.task[data-status=active],.task[data-status=evidence_ready]{border-left-color:var(--accent)}.task[data-status=blocked],.task[data-status=regressed]{border-left-color:var(--bad)}.taskhead{display:flex;justify-content:space-between;gap:10px}.taskid{font-weight:700}.badge{border-radius:999px;padding:3px 8px;font-size:11px;background:#273552;color:#d8e3ff;white-space:nowrap}.passed{background:#164b3b;color:var(--good)}.active,.evidence_ready{background:#16405b;color:var(--accent)}.blocked,.regressed{background:#55253b;color:#ffb1bd}.pending{color:var(--warn)}.desc{margin:7px 0;color:#d6def1}.meta{color:var(--muted);font-size:12px}.deps{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}.chip{background:#1b2946;border-radius:5px;padding:2px 6px;font-size:11px;color:#bbcae8}.side{display:grid;gap:16px;align-content:start}.bar{height:9px;background:#25314c;border-radius:8px;overflow:hidden;display:flex}.bar i{display:block;height:100%}.bpassed{background:var(--good)}.bactive{background:var(--accent)}.bpending{background:var(--warn)}.bblocked{background:var(--bad)}.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.event{padding:8px 0;border-bottom:1px solid #22304d}.event:last-child{border:0}.event small{display:block;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;color:#cbd8f5;font-size:12px;margin:0}.empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:9px}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:560px){.wrap{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.top{display:block}.actions{margin-top:12px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="title"><h1>Task Harness Visualizer</h1><p>从落盘状态恢复长任务全貌：依赖、进度、证据与独立评审。</p></div><div class="actions"><button id="demo">载入示例</button><button id="clear">清空</button></div></header>
<section class="load" id="drop"><div class="loadline"><button id="pick">选择状态文件</button><input id="files" type="file" multiple accept=".json,.jsonl,.txt"><strong>或将 .harness 文件拖到这里</strong></div><div class="hint">支持 tasks.json、evidence.jsonl、reviews.jsonl、progress.txt。页面会尝试自动读取当前目录的 .harness/ 文件（需通过本地 HTTP 服务打开）。</div><div class="status" id="status"></div></section>
<section class="stats" id="stats"></section>
<main class="layout"><section class="panel"><h2>任务队列</h2><div class="toolbar"><input id="search" placeholder="搜索任务 ID 或描述"><select id="filter"><option value="all">全部状态</option><option>pending</option><option>active</option><option>evidence_ready</option><option>passed</option><option>blocked</option><option>regressed</option></select><select id="sort"><option value="priority">优先级</option><option value="status">状态</option><option value="id">ID</option></select></div><div class="tasks" id="tasks"></div></section><aside class="side"><section class="panel"><h2>完成度</h2><div class="bar" id="bar"></div><div class="legend" id="legend"></div><p class="meta" id="completion"></p></section><section class="panel"><h2>最近证据与评审</h2><div id="events"></div></section><section class="panel"><h2>进度日志</h2><pre id="progress">尚未加载 progress.txt</pre></section></aside></main>
</div>
<script>
'use strict';
const S={tasks:{rev:null,tasks:[]},evidence:[],reviews:[],progress:'',files:[]};
const $=id=>document.getElementById(id); const statuses=['pending','active','evidence_ready','passed','blocked','regressed'];
function setStatus(t){$('status').textContent=t}
function lines(text){return text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).flatMap(x=>{try{return [JSON.parse(x)]}catch{return []}})}
function taskArray(raw){if(Array.isArray(raw))return raw;if(raw&&Array.isArray(raw.tasks))return raw.tasks;return []}
function normalize(name,text){if(name.toLowerCase().includes('tasks')){try{S.tasks=JSON.parse(text)}catch(e){setStatus('tasks.json 解析失败：'+e.message)}}else if(name.toLowerCase().includes('evidence'))S.evidence=lines(text);else if(name.toLowerCase().includes('review'))S.reviews=lines(text);else if(name.toLowerCase().includes('progress'))S.progress=text;}
async function readFiles(files){S.files=[];for(const f of files){const text=await f.text();S.files.push(f.name);normalize(f.name,text)}render();setStatus('已加载：'+S.files.join('、'))}
function count(){const ts=taskArray(S.tasks);return Object.fromEntries(statuses.map(x=>[x,ts.filter(t=>(t.status||'pending')===x).length]))}
function render(){const ts=taskArray(S.tasks), c=count();$('stats').innerHTML=statuses.map(x=>`<div class="stat"><b>${c[x]}</b><span>${x}</span></div>`).join('')+`<div class="stat"><b>${ts.length}</b><span>任务总数</span></div>`;const total=ts.length||1;$('bar').innerHTML=statuses.map(x=>`<i class="b${x}" style="width:${c[x]/total*100}%" title="${x}: ${c[x]}"></i>`).join('');$('legend').innerHTML=statuses.map(x=>`<span><i class="b${x}"></i>${x} ${c[x]}</span>`).join('');$('completion').textContent=`通过 ${c.passed}/${ts.length||0} · rev ${S.tasks.rev??'—'} · evidence ${S.evidence.length} 条 · reviews ${S.reviews.length} 条`;$('progress').textContent=S.progress||'尚未加载 progress.txt';renderTasks(ts);renderEvents()}
function renderTasks(all){const q=$('search').value.toLowerCase(), f=$('filter').value, sort=$('sort').value;let ts=all.filter(t=>{const st=t.status||'pending';return(f==='all'||st===f)&&(!q||JSON.stringify(t).toLowerCase().includes(q))});ts.sort((a,b)=>sort==='id'?String(a.id).localeCompare(String(b.id)):sort==='status'?String(a.status||'pending').localeCompare(String(b.status||'pending')):(Number(a.priority??999)-Number(b.priority??999)));$('tasks').innerHTML=ts.length?ts.map(t=>{const st=t.status||'pending',deps=t.depends_on||t.dependsOn||[];return `<article class="task" data-status="${st}"><div class="taskhead"><span class="taskid">${esc(t.id??'未命名')}</span><span class="badge ${st}">${st}</span></div><div class="desc">${esc(t.desc||t.description||'')}</div><div class="meta">优先级 ${esc(t.priority??'—')} · 验证：${esc(t.verify||'—')}</div>${deps.length?`<div class="deps">依赖：${deps.map(d=>`<span class="chip">${esc(d)}</span>`).join('')}</div>`:''}</article>`}).join(''):'<div class="empty">没有匹配的任务</div>'}
function renderEvents(){const ev=S.evidence.slice(-5).reverse().map(x=>`<div class="event"><b>证据 · ${esc(x.task||x.id||'—')}</b><small>${esc(x.tests||x.cmd||'')} · exit ${esc(x.exit??'—')} · ${esc(x.ts||'')}</small></div>`);const rv=S.reviews.slice(-5).reverse().map(x=>`<div class="event"><b>评审 · ${esc(x.task||'—')} · ${esc(x.verdict||'—')}</b><small>${esc(x.reviewer_context||'')} · ${esc(x.ts||'')}</small></div>`);$('events').innerHTML=ev.concat(rv).join('')||'<div class="empty">尚未加载证据或评审</div>'}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('pick').onclick=()=>$('files').click();$('files').onchange=e=>readFiles([...e.target.files]);['search','filter','sort'].forEach(id=>$(id).oninput=render);$('clear').onclick=()=>{S.tasks={rev:null,tasks:[]};S.evidence=[];S.reviews=[];S.progress='';S.files=[];render();setStatus('已清空')};$('demo').onclick=()=>{S.tasks={rev:3,tasks:[{id:'design',priority:1,desc:'建立任务契约',depends_on:[],verify:'validate contract',status:'passed'},{id:'build',priority:2,desc:'实现核心功能',depends_on:['design'],verify:'run tests',status:'active'},{id:'review',priority:3,desc:'独立评审',depends_on:['build'],verify:'review evidence',status:'pending'}]};S.evidence=[{task:'design',tests:'contract ok',exit:0,ts:new Date().toISOString()}];S.reviews=[{task:'design',verdict:'pass',reviewer_context:'independent',ts:new Date().toISOString()}];S.progress='示例数据：当前推进 build。';render();setStatus('已载入示例数据')};const drop=$('drop');['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>readFiles([...e.dataTransfer.files]));
(async()=>{try{const base='.harness/';const names=['tasks.json','evidence.jsonl','reviews.jsonl','progress.txt'];const fs=[];for(const n of names){const r=await fetch(base+n);if(r.ok)fs.push(new File([await r.blob()],n))}if(fs.length)await readFiles(fs)}catch{setStatus('请选择状态文件，或通过本地 HTTP 服务打开以自动读取 .harness/')}render()})();
</script>
</body></html>
