<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长任务看板</title>
<meta name="task-harness" content="spa">
<link rel="icon" href="data:,">
<style>
:root{
  color-scheme: light dark;
  --canvas:oklch(96.6% 0.004 80);
  --surface:oklch(100% 0 0);
  --surface-2:oklch(98.2% 0.003 80);
  --line:oklch(92% 0.005 80);
  --line-2:oklch(85% 0.006 80);
  --ink:oklch(19% 0.012 80);
  --ink-2:oklch(38% 0.010 80);
  --muted:oklch(55% 0.008 80);
  --faint:oklch(66% 0.006 80);
  --solid-bg:oklch(21% 0.012 80);
  --solid-ink:oklch(99% 0 0);
  --hover:oklch(95.5% 0.004 80);
  --pick:oklch(93.5% 0.004 80);
  --accent:oklch(45% 0.13 315);
  --accent-strong:oklch(38% 0.13 315);
  --accent-wash:oklch(45% 0.13 315 / 0.055);
  --accent-edge:oklch(45% 0.13 315 / 0.22);
  --st-pending:oklch(60% 0.007 80);
  --st-active:oklch(53% 0.13 250);
  --st-ready:oklch(52% 0.11 200);
  --st-passed:oklch(51% 0.13 150);
  --st-blocked:oklch(52% 0.17 28);
  --st-regressed:oklch(60% 0.13 68);
  --danger:oklch(50% 0.18 28);
  --mono:ui-monospace,Consolas,"Cascadia Mono","Courier New",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  --r-xs:3px; --r-sm:6px; --r-lg:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --canvas:oklch(16.5% 0.006 80);
    --surface:oklch(21% 0.006 80);
    --surface-2:oklch(24.5% 0.006 80);
    --line:oklch(28% 0.006 80);
    --line-2:oklch(35% 0.007 80);
    --ink:oklch(96% 0.004 80);
    --ink-2:oklch(78% 0.006 80);
    --muted:oklch(62% 0.008 80);
    --faint:oklch(49% 0.008 80);
    --solid-bg:oklch(94% 0.004 80);
    --solid-ink:oklch(18% 0.01 80);
    --hover:oklch(25.5% 0.006 80);
    --pick:oklch(28% 0.007 80);
    --accent:oklch(74% 0.14 315);
    --accent-strong:oklch(82% 0.12 315);
    --accent-wash:oklch(74% 0.14 315 / 0.12);
    --accent-edge:oklch(74% 0.14 315 / 0.30);
    --st-pending:oklch(58% 0.008 80);
    --st-active:oklch(72% 0.12 250);
    --st-ready:oklch(72% 0.10 200);
    --st-passed:oklch(72% 0.13 150);
    --st-blocked:oklch(68% 0.16 28);
    --st-regressed:oklch(78% 0.12 68);
    --danger:oklch(70% 0.16 28);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--ink);font:400 13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
kbd{font:11px/1 var(--mono);color:var(--faint);border:1px solid var(--line-2);border-radius:3px;padding:1px 4px}
code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero}
.num{font-variant-numeric:tabular-nums slashed-zero}
h2{font:500 11px/1 var(--sans);letter-spacing:.07em;color:var(--faint);margin:0 0 9px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.grow{flex:1;min-width:0}

.app{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:46px minmax(0,1fr) 28px;height:100vh}

.rail{grid-column:1;grid-row:1/-1;display:flex;flex-direction:column;gap:22px;padding:16px 14px;min-width:0;overscroll-behavior:contain}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .mark{flex:none;width:26px;height:26px;border-radius:var(--r-sm);background:var(--solid-bg);color:var(--solid-ink);display:grid;place-items:center}
.brand .mark svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.brand .txt{min-width:0}
.brand b{display:block;font-size:15px;font-weight:500;letter-spacing:-0.015em}
.brand #project{display:block;margin-top:2px;font:400 11.5px/1.3 var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav[aria-label="任务视图"]{display:flex;flex-direction:column;gap:2px}
nav button{width:100%;display:grid;grid-template-columns:16px minmax(0,1fr) auto;align-items:center;gap:9px;
  height:32px;padding:0 9px;border-radius:var(--r-sm);color:var(--ink-2);text-align:left;position:relative;transition:background 90ms,color 90ms}
nav button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;color:var(--faint)}
nav button:hover{background:var(--hover);color:var(--ink)}
nav button:hover svg{color:var(--muted)}
nav button b{font:500 13px/1 var(--mono);font-variant-numeric:tabular-nums slashed-zero;color:var(--ink)}
nav button[aria-current=page]{background:var(--pick);color:var(--ink);font-weight:500}
nav button[aria-current=page]::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--ink)}
nav button[aria-current=page] svg{color:var(--ink)}
.legend ul{list-style:none;margin:0 0 8px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.legend li{display:flex;align-items:center;min-width:0;font-size:11.5px;color:var(--muted)}
.legend li .dot{margin-right:7px}
.legend p{margin:0 0 3px;font-size:11.5px;color:var(--faint)}
  .legend p:last-child{margin-bottom:0}
  /* 状态词典：不只给词，还给"这个词到底什么意思" */
  .legend ul{grid-template-columns:1fr}
  .legend li{display:block;line-height:1.45;margin-bottom:4px}
  .legend li .dot{display:inline-block;vertical-align:middle}
  .legend li em{display:block;margin-left:14px;font-style:normal;color:var(--faint);font-size:11px}
  /* 项目地图：回答"我现在站在哪 / 对不对 / 下一步做什么" */
  .map{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;margin-bottom:12px}
  .map-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .map-head h2{margin:0;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
  .map-head span{font-size:11px;color:var(--faint)}
  .map .where{margin:2px 0 10px;font-size:13.5px;color:var(--ink)}
  .map h3{margin:12px 0 6px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
  .map p{margin:0 0 6px}
  .cap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
  .cap{display:flex;align-items:center;gap:8px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--surface-2);min-width:0}
  .cap span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cap .s{font-size:10px;font-weight:600;padding:1px 6px;border-radius:5px;white-space:nowrap}
  .cap.usable .s{background:oklch(93% 0.06 150);color:oklch(36% 0.12 150)}
  .cap.partial .s{background:oklch(94% 0.07 80);color:oklch(40% 0.12 70)}
  .cap.shell .s,.cap.missing .s{background:oklch(93% 0.004 80);color:var(--muted)}
  .map-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .map ul{margin:0;padding-left:16px}
  .map li{font-size:12.5px;color:var(--ink-2);margin:4px 0}
  .map li b{color:var(--ink)}
  .map .src{color:var(--faint);font-size:11.5px}
  .map li.lim{color:oklch(45% 0.12 40)}
.keys{padding-top:14px;border-top:1px solid var(--line)}
.keys p{display:flex;justify-content:space-between;gap:8px;margin:0 0 6px;font-size:11.5px;color:var(--faint)}
.keys p:last-child{margin-bottom:0}
.rail .spacer{flex:1}

.top{grid-column:2;display:flex;align-items:center;gap:9px;padding:0 16px}
.path{display:flex;align-items:baseline;gap:8px;min-width:0}
.path b{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path span{font:400 11.5px/1 var(--mono);color:var(--faint);flex:none}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:9px;width:14px;height:14px;color:var(--faint);stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round}
.search{height:32px;width:min(250px,32vw);padding:0 10px 0 29px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font-size:12.5px;transition:border-color 90ms}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:var(--accent-edge)}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:var(--r-sm);
  font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  transition:background 90ms,color 90ms,transform 60ms}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-solid{background:var(--solid-bg);border-color:var(--solid-bg);color:var(--solid-ink)}
.btn-solid:hover:not(:disabled){background:var(--solid-bg);color:var(--solid-ink);opacity:.86}
.btn-solid kbd{color:inherit;border-color:currentColor;opacity:.45}
.btn-icon{display:grid;place-items:center;width:32px;height:32px;flex:none;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface);color:var(--muted);transition:background 90ms,color 90ms}
.btn-icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-icon:hover:not(:disabled){background:var(--hover);color:var(--ink)}

.main{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:12px;padding:0 16px 12px;min-height:0}

.hero{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:14px 20px 14px 22px;position:relative;overflow:hidden;flex:none}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.hero.is-empty::before{background:var(--line-2)}
.hero-label{font:500 11px/1 var(--sans);letter-spacing:.07em;color:var(--faint);margin:0 0 8px}
.hero-line{display:flex;align-items:baseline;gap:14px;min-width:0}
.hero-id{font:500 38px/1 var(--mono);letter-spacing:-0.035em;color:var(--accent);
  font-variant-numeric:tabular-nums slashed-zero;flex:none}
.hero.is-empty .hero-id{color:var(--faint)}
.hero-desc{font-size:17px;font-weight:500;letter-spacing:-0.01em;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hero-meta{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.hero-meta .sep{width:1px;height:11px;background:var(--line-2)}
.ladder{display:inline-flex;gap:3px;align-items:center}
.ladder i{display:block;width:13px;height:5px;border-radius:1px;background:var(--line-2)}
.ladder i.on{background:var(--st-passed)}
.hero-run{display:flex;align-items:center;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.run-label{font:500 11px/1 var(--sans);letter-spacing:.07em;color:var(--faint);flex:none}
.run-cmd{flex:1;min-width:0;display:block;padding:7px 10px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--line);font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero.is-empty .run-cmd{color:var(--faint)}

.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tools{display:flex;align-items:center;gap:10px;padding:11px 16px;flex-wrap:wrap;flex:none}
.filter-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 10px;font-size:11.5px;font-weight:500;
  border:1px solid var(--accent-edge);color:var(--accent-strong);background:var(--accent-wash);border-radius:999px}
.filter-chip[hidden]{display:none}
.chip-x{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:13px;line-height:1;color:inherit}
.chip-x:hover{background:var(--accent);color:var(--surface)}
.sort-wrap{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint)}
select{height:28px;padding:0 6px;border:1px solid var(--line);border-radius:var(--r-xs);background:var(--surface);font-size:12px}
.hint{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums slashed-zero}
.table-wrap{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable;border-top:1px solid var(--line)}
table{width:100%;table-layout:fixed;border-collapse:collapse}
th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;
  font:500 11px/1 var(--sans);letter-spacing:.06em;color:var(--faint);padding:9px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:0 12px;height:36px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th.num,td.num{text-align:right}
tr td{transition:background 90ms}
tbody tr:hover td{background:var(--hover)}
tbody tr[aria-selected=true] td{background:var(--pick)}
tbody tr[aria-selected=true] td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
td.cell-id .id{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums slashed-zero}
td.cell-id .bar{display:inline-block;vertical-align:middle;margin-left:9px;height:4px;width:36px;border-radius:2px;overflow:hidden;background:var(--line-2)}
td.cell-id .bar i{display:block;height:100%;background:var(--st-passed)}
td.cell-id .none{display:inline-block;vertical-align:middle;margin-left:9px;width:36px;text-align:center;font-size:11px;color:var(--faint)}
td.state{color:var(--ink-2)}
td.deps,td.cmd{color:var(--muted);font-size:12px}
td.gate{color:var(--muted)}
td.empty{color:var(--faint);white-space:normal;height:auto;padding:22px 12px}
tbody tr:last-child td{border-bottom:0}
.flag{display:inline-block;padding:2px 7px;border-radius:var(--r-xs);font-size:11px;font-weight:500;line-height:1.4;
  border:1px solid var(--line-2);color:var(--muted)}
.flag.warn{border-color:var(--danger);color:var(--danger)}

.side{display:none}
.side .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px}
.detail .id{font:500 15px/1 var(--mono);color:var(--ink);margin:0 0 6px;letter-spacing:-0.02em}
.detail p{margin:0 0 7px;font-size:12px;line-height:1.55;color:var(--ink-2)}
.detail p:last-child{margin-bottom:0}
.detail .muted{color:var(--muted)}
.detail .warn{color:var(--danger)}
.detail code{font-size:11.5px;color:var(--muted);word-break:break-all;white-space:normal}
.event{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.event:first-child{padding-top:0}
.event:last-child{border-bottom:0;padding-bottom:0}
.event b{font-weight:500;color:var(--ink-2)}
.event .id{font-family:var(--mono);font-weight:500;color:var(--ink)}
.event small{display:block;margin-top:3px;font-size:11.5px;color:var(--muted)}
.event small.ts{font-family:var(--mono)}
.empty-note{margin:0;font-size:12px;color:var(--faint)}
details.log{padding:0}
details.log summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
  font:500 11px/1 var(--sans);letter-spacing:.07em;color:var(--faint);padding:14px 16px}
details.log summary::-webkit-details-marker{display:none}
details.log summary::before{content:"";width:0;height:0;border-left:5px solid var(--faint);
  border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform 120ms}
details.log[open] summary::before{transform:rotate(90deg)}
details.log pre{margin:0;padding:0 16px 14px;white-space:pre-wrap;word-break:break-word;
  font:11.5px/1.6 var(--mono);color:var(--muted);max-height:240px;overflow:auto}

.statusbar{grid-column:2;grid-row:3;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:11.5px;color:var(--faint)}
.status{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.err{color:var(--danger)}
.ro{flex:none;font:400 11px/1 var(--mono);color:var(--faint)}

@media(min-width:1360px){
  .app{grid-template-columns:212px minmax(0,1fr) 288px}
  .side{display:block;grid-column:3;grid-row:2;min-height:0;overflow:auto;padding:0 16px 12px 0}
  .statusbar{grid-column:2/4}
}
@media(max-width:1023px){
  .app{grid-template-columns:1fr;grid-template-rows:46px auto minmax(0,1fr) 28px}
  .rail{display:none}
  .top{grid-column:1;grid-row:1}
  .main{grid-column:1;grid-row:3}
  .statusbar{grid-column:1;grid-row:4}
}
@media(max-width:860px){
  .hero-id{font-size:30px}
  .hero-line{flex-direction:column;align-items:flex-start;gap:5px}
  .hero-desc{white-space:normal}
  .hero-run{flex-wrap:wrap}
  .run-label{width:100%}
  .top{flex-wrap:wrap;height:auto;padding:10px 16px;row-gap:8px}
  .search{width:100%}
  .path{display:none}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}

.app{display:grid;grid-template-columns:212px minmax(0,1fr) 300px;grid-template-rows:46px minmax(0,1fr) 28px;height:100vh}
.rail{grid-column:1;grid-row:1/-1;display:flex;flex-direction:column;gap:18px;padding:16px 14px;min-width:0;overscroll-behavior:contain}
.slot{flex:1;min-height:72px}
.top{grid-column:2/4;display:flex;align-items:center;gap:9px;padding:0 16px}
.main{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:0;padding:0 16px 12px;min-height:0;min-width:0}
.tabs{display:flex;gap:2px;padding:0 0 10px;flex:none}
.tabs button{height:30px;padding:0 12px;border-radius:var(--r-sm);color:var(--muted);font-size:13px}
.tabs button:hover{background:var(--hover);color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.panel[hidden]{display:none}
.cards{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding:0 14px 14px;align-content:start}
.tcard{display:flex;flex-direction:column;gap:8px;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;text-align:left;min-width:0}
.tcard:hover{border-color:var(--line-2);background:var(--hover)}
.tcard[aria-selected="true"]{border-color:var(--accent-edge);background:var(--accent-wash);box-shadow:inset 3px 0 0 var(--accent)}
.tcard .row{display:flex;align-items:center;gap:8px;min-width:0}
.tcard .id{font:500 13px/1.2 var(--mono);color:var(--ink)}
.tcard .pri{margin-left:auto;font:400 11px/1 var(--mono);color:var(--faint)}
.tcard .state{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.tcard .desc{margin:0;font-size:12.5px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11.5px;color:var(--muted)}
.tcard .cmd{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .wave{padding:1px 6px;border:1px solid var(--line);border-radius:999px;font-size:11px}
.flag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:11px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.flag.warn{color:var(--danger);border-color:color-mix(in oklch,var(--danger) 40%,var(--line))}
.empty{grid-column:1/-1;padding:28px 12px;text-align:center;color:var(--faint)}

<script>
'use strict';
const $ = id => document.getElementById(id);
const labels = {pending:'待处理',active:'进行中',evidence_ready:'待独立评审',passed:'已通过',blocked:'已阻塞',regressed:'需回归'};
const colors = {pending:'var(--st-pending)',active:'var(--st-active)',evidence_ready:'var(--st-ready)',passed:'var(--st-passed)',blocked:'var(--st-blocked)',regressed:'var(--st-regressed)'};
const states = Object.keys(labels);
const optional = ['evidence.jsonl','reviews.jsonl','progress.txt','board.json'];
const views = [['blocked','已阻塞'],['evidence_ready','待评审'],['active','进行中'],['eligible','可推进'],['all','全部任务']];
let model = {tasks:{tasks:[]},evidence:[],reviews:[],progress:'',board:null};
// 状态词典：每个词对"人"到底意味着什么 —— 尤其 evidence_ready 最容易误读。
const means = {
  pending:'还没开始',
  active:'正在做，还没交',
  evidence_ready:'做完了，但还没有独立评审确认 —— 既不是"做完"也不是"没做完"，是"等人验"',
  passed:'独立评审通过 —— 只有这个状态能叫"完成"',
  blocked:'卡住了（原因记在任务里，通常是环境缺失）',
  regressed:'曾经通过，但因依赖/接口变更失效，需要重做'
};
const fillOf = {pending:8,active:42,evidence_ready:78,passed:100,blocked:28,regressed:55};
let selected = 0, filter = 'all', sortBy = 'priority', heroCmd = '', mainTab = 'next';
let chain = Promise.resolve(), statusTimer = null;
const timers = {
  set(fn, ms){ if(typeof setTimeout === 'function'){ timers.id = setTimeout(fn, ms); } },
  clear(){ if(typeof clearTimeout === 'function' && timers.id != null){ clearTimeout(timers.id); } timers.id = null; }
};
const esc = value => String(typeof value === 'object' ? JSON.stringify(value) : value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setText = (id,text) => { const el = $(id); if(el) el.textContent = text; };
function status(text, error=false){ timers.clear(); setText('status',text); const el = $('status'); if(el && el.classList && el.classList.toggle) el.classList.toggle('err',error); }
function flash(text){ const el = $('status'); const prev = el ? el.textContent : ''; status(text); timers.set(()=>status(prev), 1600); }
function isLocalFile(){ return location.protocol === 'file:'; }
function localFileHint(){ return '点「载入任务」选择项目任务目录（.harness 或项目根）。桌面壳可直接选文件夹。'; }
function parse(texts){
  if(!Object.hasOwn(texts,'tasks.json')) throw Error('缺少任务文件；原任务保持不变');
  let tasks;
  try{tasks = JSON.parse(texts['tasks.json'].replace(/^\uFEFF/,''));}catch{throw Error('任务文件格式错误；原任务保持不变');}
  if(!tasks || !Array.isArray(tasks.tasks)) throw Error('任务文件必须包含任务数组');
  const ids = new Set();
  for(const t of tasks.tasks){
    if(!t || typeof t.id !== 'string' || !t.id.trim() || ids.has(t.id)) throw Error('任务编号缺失或重复');
    if(!Object.hasOwn(labels,t.status)) throw Error('任务包含未知状态');
    if(t.depends_on !== undefined && (!Array.isArray(t.depends_on) || t.depends_on.some(d=>typeof d !== 'string'))) throw Error('任务依赖必须是编号数组');
    ids.add(t.id);
  }
  function jsonl(name){
    return (texts[name] || '').replace(/^\uFEFF/,'').split(/\r?\n/).flatMap((line,i)=>{
      if(!line.trim()) return [];
      try{
        const row = JSON.parse(line);
        if(!row || typeof row !== 'object' || Array.isArray(row)) throw Error();
        return [row];
      }catch{
        throw Error((name.startsWith('evidence') ? '证据' : '评审') + '文件第 ' + (i+1) + ' 行格式错误');
      }
    });
  }
  return {tasks, evidence:jsonl('evidence.jsonl'), reviews:jsonl('reviews.jsonl'), progress:texts['progress.txt'] || '', board:parseBoard(texts['board.json'])};
}
function parseBoard(raw){
  try{
    const o = JSON.parse(String(raw || '').replace(/^\uFEFF/,''));
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : null;
  }catch{ return null; }   // 地图是可选视图，坏了不影响任务队列
}
function install(texts, source){ model = parse(texts); render(); renderMap(); status(source + ' · ' + new Date().toLocaleTimeString('zh-CN')); }

/* 项目地图：回答"我现在站在哪 / 对不对 / 下一步做什么"。
   数据来自可选的 .harness/board.json —— 缺了就不显示，不影响任务队列。 */
function renderMap(){
  const card = $('map-card'); if(!card) return;
  const b = model.board;
  if(!b || !(b.where || (b.next && b.next.length))){ card.hidden = true; return; }
  card.hidden = false;
  const where = $('map-where');
  if(where) where.textContent = b.where || '';
  const nextEl = $('map-next');
  if(nextEl){
    const next = b.next || [];
    nextEl.innerHTML = next.length ? '<ul>' + next.map(n=>'<li><b>' + esc(n.task) + '</b> —— 为什么是它：' + esc(n.why || '未写')
      + (n.see ? '<br><span class="src">做完你会看到：' + esc(n.see) + '</span>' : '') + '</li>').join('') + '</ul>'
      : '';
  }
}
function gate(t){
  if(t.status !== 'passed') return '';
  const r = model.reviews.filter(r=>r.task === t.id).at(-1);
  const ev = r && model.evidence.find(e=>e.task === t.id && e.id && e.id === r.ev);
  return r?.verdict === 'pass' && r.reviewer_context && ev?.exit === 0
    ? '已关联记录，独立性须人工核验'
    : '门禁缺口：缺成功证据或独立评审';
}
function eligible(all){
  const byId = new Map(all.map(t=>[t.id,t]));
  return all.filter(t=>(t.status === 'pending' || t.status === 'regressed') && (t.depends_on || []).every(d=>byId.get(d)?.status === 'passed'))
    .sort((a,b)=>Number(a.priority ?? 999999) - Number(b.priority ?? 999999));
}
function depMarkup(byId, deps){
  if(!deps.length) return '<span class="none" title="无依赖">—</span>';
  const done = deps.filter(d=>byId.get(d)?.status === 'passed').length;
  return '<span class="bar" title="依赖 ' + done + '/' + deps.length + ' 已通过"><i style="width:' + (done/deps.length*100) + '%"></i></span>';
}
function waveOf(t){ return t.wave || ('阶段 ' + (t.phase ?? '未分组')); }
function setTab(tab){
  const tabs = ['list','gantt','next','log'];
  mainTab = tabs.indexOf(tab) >= 0 ? tab : 'next';
  for(const id of tabs){
    const panel = $('tab-' + id);
    if(panel) panel.hidden = mainTab !== id;
    const btn = $('tab-btn-' + id);
    if(btn && btn.setAttribute) btn.setAttribute('aria-selected', String(mainTab === id));
  }
}
function openEvents(){
  const d = $('events-drawer');
  if(d) d.hidden = false;
}
function closeEvents(){
  const d = $('events-drawer');
  if(d) d.hidden = true;
}
function renderCards(rows, byId){
  const tasksEl = $('tasks');
  if(!tasksEl) return;
  tasksEl.innerHTML = rows.map((t,i)=>{
    const tDeps = t.depends_on || [];
    const depText = tDeps.map(d=>d + '/' + (byId.has(d) ? labels[byId.get(d).status] : '缺失')).join('、') || '无';
    const g = gate(t);
    const cell = g
      ? (g.startsWith('门禁')
          ? '<span class="flag warn" title="' + esc(g) + '">门禁缺口</span>'
          : '<span class="flag" title="' + esc(g) + '">已关联</span>')
      : '';
    const title = t.desc || t.description || '';
    return '<article class="tcard" data-i="' + i + '" aria-selected="' + (i === selected) + '">'
      + '<div class="row"><span class="id">' + esc(t.id) + '</span><span class="pri">P' + esc(t.priority ?? '—') + '</span></div>'
      + '<div class="state"><i class="dot" style="background:' + colors[t.status] + '" aria-hidden="true"></i>' + labels[t.status] + '</div>'
      + '<p class="desc" title="' + esc(title) + '">' + esc(title || '未填写') + '</p>'
      + '<div class="meta">'
      + (t.wave || t.phase != null ? '<span class="wave">' + esc(waveOf(t)) + '</span>' : '')
      + '<span>依赖 ' + depMarkup(byId, tDeps) + ' ' + esc(depText === '无' ? '无' : tDeps.length + ' 项') + '</span>'
      + '<span class="cmd mono" title="' + esc(t.verify || '') + '">' + esc(t.verify || '未填写') + '</span>'
      + cell
      + '</div></article>';
  }).join('') || '<div class="empty">暂无匹配任务。按 L 选择项目任务目录，按 R 刷新。</div>';
}
function renderGantt(rows){
  const keyEl = $('gantt-key');
  if(keyEl){
    keyEl.innerHTML = states.map(s=>'<span><i class="dot" style="background:' + colors[s] + '"></i>' + esc(labels[s]) + '</span>').join('')
      + '<span>实心长条 = 已通过 · 短条 = 未完成</span>';
  }
  setText('gantt-count', rows.length + ' 条 · 按 Wave 分组，条长表示完成度');
  const ganttEl = $('gantt');
  if(!ganttEl) return;
  if(!rows.length){
    ganttEl.innerHTML = '<div class="empty">暂无匹配任务。按 L 选择项目任务目录，按 R 刷新。</div>';
    return;
  }
  const groups = [];
  const index = new Map();
  rows.forEach((t,i)=>{
    const key = waveOf(t);
    if(!index.has(key)){ index.set(key, groups.length); groups.push({key, items:[]}); }
    groups[index.get(key)].items.push([t,i]);
  });
  ganttEl.innerHTML = groups.map(g=>{
    const passed = g.items.filter(x=>x[0].status === 'passed').length;
    const pct = Math.round(passed / g.items.length * 100);
    return '<section class="lane"><h3><b>' + esc(g.key) + '</b>'
      + '<span class="lane-meter" title="' + passed + '/' + g.items.length + ' 已通过"><i style="width:' + pct + '%"></i></span>'
      + '<span class="lane-stat">' + passed + '/' + g.items.length + ' 已通过</span></h3>'
      + g.items.map(([t,i])=>{
        const w = fillOf[t.status] ?? 20;
        return '<div class="g-row" data-i="' + i + '" aria-selected="' + (i === selected) + '">'
          + '<span class="id" title="' + esc(t.desc || t.id) + '">' + esc(t.id) + '</span>'
          + '<span class="track" title="' + esc(labels[t.status]) + '"><i style="width:' + w + '%;background:' + colors[t.status] + '"></i></span>'
          + '<span class="g-state"><i class="dot" style="background:' + colors[t.status] + '"></i>' + labels[t.status] + '</span>'
          + '</div>';
      }).join('')
      + '</section>';
  }).join('');
}
function render(){
  const all = model.tasks.tasks;
  const counts = Object.fromEntries(states.map(s=>[s, all.filter(t=>t.status === s).length]));
  const byId = new Map(all.map(t=>[t.id,t]));
  const ready = eligible(all), next = ready[0];
  const deps = next ? (next.depends_on || []) : [];
  const done = deps.filter(d=>byId.get(d)?.status === 'passed').length;

  setText('proj-name', model.tasks.project || '未命名项目');
  setText('proj-rev', 'rev ' + (model.tasks.rev ?? '—'));
  setText('hero-id', next ? next.id : '—');
  setText('hero-desc', next ? (next.desc || next.description || '未填写描述')
    : (all.length ? '没有可推进任务：依赖未满足或已全部完成' : '尚未编排任务'));
  const hero = $('hero-card');
  if(hero && hero.classList && hero.classList.toggle) hero.classList.toggle('is-empty', !next);
  const dep = $('hero-dep');
  if(dep){
    if(!next) dep.innerHTML = '<span>—</span>';
    else {
      const chain = deps.length
        ? '<span class="ladder">' + deps.map(d=>'<i class="' + (byId.get(d)?.status === 'passed' ? 'on' : 'off') + '"></i>').join('') + '</span>'
          + '<span>依赖 ' + done + '/' + deps.length + ' 已通过</span>'
        : '<span>无前置依赖</span>';
      dep.innerHTML = chain + '<span class="sep"></span><span>优先级 ' + esc(next.priority ?? '—') + '</span>';
    }
  }
  heroCmd = next ? (next.verify || '') : '';
  setText('hero-cmd', heroCmd || '未填写验证命令');
  const copyBtn = $('copy');
  if(copyBtn) copyBtn.disabled = !heroCmd;

  setText('c-all', String(all.length));
  setText('c-eligible', String(ready.length));
  setText('c-active', String(counts.active));
  setText('c-evidence_ready', String(counts.evidence_ready));
  setText('c-blocked', String(counts.blocked));
  for(const pair of views){
    const id = pair[0];
    let b = null;
    try{ b = document.querySelector('#rail-nav [data-filter="' + id + '"]'); }catch(e){ b = null; }
    if(b && b.setAttribute) b.setAttribute('aria-current', filter === id ? 'page' : 'false');
  }

  const chip = $('filter-chip');
  if(chip){
    if(filter === 'all'){ chip.hidden = true; chip.innerHTML = ''; }
    else{
      const found = views.find(v=>v[0] === filter);
      const name = (found ? found[1] : null) || labels[filter] || filter;
      chip.hidden = false;
      chip.innerHTML = '筛选：' + esc(name) + ' <button type="button" class="chip-x" data-filter="all" aria-label="清除筛选">×</button>';
    }
  }
  const sortEl = $('sort');
  if(sortEl) sortEl.value = sortBy;

  const searchEl = $('search');
  const q = ((searchEl && searchEl.value) || '').toLowerCase();
  const readyIds = new Set(ready.map(t=>t.id));
  const rows = all.filter(t=>{
    if(filter === 'eligible' && !readyIds.has(t.id)) return false;
    if(filter !== 'all' && filter !== 'eligible' && t.status !== filter) return false;
    return JSON.stringify(t).toLowerCase().includes(q);
  });
  rows.sort((a,b)=> sortBy === 'id' ? String(a.id).localeCompare(String(b.id))
    : sortBy === 'status' ? states.indexOf(a.status) - states.indexOf(b.status)
    : Number(a.priority ?? 999999) - Number(b.priority ?? 999999));
  if(selected >= rows.length) selected = Math.max(0, rows.length - 1);
  setText('count', rows.length + ' 条' + (filter === 'all' ? '' : ' · 已筛选') + ' · 第 ' + (rows.length ? selected + 1 : 0) + ' 张');
  setTab(mainTab);

  renderCards(rows, byId);
  renderGantt(rows);

  const current = rows[selected];
  const detailEl = $('detail');
  if(detailEl){
    if(!current) detailEl.innerHTML = '<p class="empty-note">没有选中任务</p>';
    else{
      const g = gate(current);
      const tDeps = current.depends_on || [];
      detailEl.innerHTML = '<p class="id">' + esc(current.id) + '</p>'
        + '<p>' + labels[current.status] + ' · 优先级 ' + esc(current.priority ?? '—') + '</p>'
        + '<p>' + esc(current.desc || current.description || '未填写') + '</p>'
        + '<p class="muted">依赖 ' + (tDeps.length ? esc(tDeps.join('、')) : '无') + '</p>'
        + (current.reason ? '<p class="warn">阻塞原因：' + esc(typeof current.reason === 'string' ? current.reason : JSON.stringify(current.reason)) + '</p>' : '')
        + '<p><code>' + esc(current.verify || '未填写验证') + '</code></p>'
        + '<p class="' + (g.startsWith('门禁') ? 'warn' : 'muted') + '">' + esc(g || '无门禁缺口') + '</p>';
    }
  }

  const verdict = {pass:'通过',fail:'评审未通过'};
  const events = [...model.evidence.map(x=>({...x,kind:'e'})), ...model.reviews.map(x=>({...x,kind:'r'}))]
    .sort((a,b)=>String(b.ts || '').localeCompare(String(a.ts || ''))).slice(0,5);
  const eventsEl = $('events');
  if(eventsEl){
    eventsEl.innerHTML = events.map(x=>'<div class="event"><b>' + (x.kind === 'e' ? '证据' : '评审')
      + ' · <span class="id">' + esc(x.task || '—') + '</span></b><small>'
      + (x.kind === 'e' ? '退出码 ' + esc(x.exit ?? '未知') : (verdict[x.verdict] || '未知') + ' · ' + esc(x.reviewer_context || '未记录上下文'))
      + '</small><small class="ts">' + esc(x.ts || '未记录时间') + '</small></div>').join('')
      || '<p class="empty-note">暂无证据或评审</p>';
  }
  setText('progress', model.progress || '暂无进度日志');
}
async function fetchOne(name){
  const errs = []; let notFound = false;
  for(const base of ['./','../']){
    const rel = base + name;
    try{
      const r = await fetch(new URL(rel, location.href), {cache:'no-store'});
      if(r.ok) return await r.text();
      if(r.status === 404){ notFound = true; continue; }
      errs.push(rel + ' → HTTP ' + r.status);
    }catch(e){ errs.push(rel + ' → ' + ((e && e.message) || '读取异常')); }
  }
  if(!errs.length && notFound) return null;
  throw Error(name + ' 读取失败（' + (errs.join('；') || '未找到') + '）');
}
async function fetchHarness(){
  if(isLocalFile()) throw Error(localFileHint());
  const texts = {};
  const tasks = await fetchOne('tasks.json');
  if(!tasks) return null;
  texts['tasks.json'] = tasks;
  for(const n of optional){
    try{
      const text = await fetchOne(n);
      if(text !== null) texts[n] = text;
    }catch(e){ /* 可选文件缺失或损坏不阻断看板 */ }
  }
  return texts;
}
function showEmpty(message){
  model = {tasks:{tasks:[]},evidence:[],reviews:[],progress:''};
  selected = 0;
  render();
  renderMap();
  status(message);
}
function guarded(fn){
  const run = chain.then(async()=>{
    const r = $('refresh'), l = $('load');
    if(r) r.disabled = true;
    if(l) l.disabled = true;
    try{ await fn(); }
    catch(e){ status('读取失败：' + e.message, true); }
    finally{
      if(r) r.disabled = false;
      if(l) l.disabled = false;
    }
  });
  chain = run.catch(()=>{});
  return run;
}
function isTauri(){ return !!(window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke); }
function canPickDir(){ return isTauri() || typeof window.showDirectoryPicker === 'function'; }
let selectedPath = '';
let dirHandle = null;
function setDirLabel(path){
  const el = $('project');
  if(el) el.textContent = path || '未选择目录';
  const hint = $('source-hint');
  if(hint) hint.textContent = path ? ('只读 · ' + path) : '只读，不写任务真相源';
}
function rememberPath(path){
  selectedPath = path || '';
  try{ if(selectedPath && isTauri()) localStorage.setItem('task-harness.lastDir', selectedPath); }catch(e){}
  setDirLabel(selectedPath);
}
async function fileFromHandle(dir, name){
  try{
    const fh = await dir.getFileHandle(name);
    return await (await fh.getFile()).text();
  }catch(e){ return null; }
}
async function readFromHandle(root){
  const direct = await fileFromHandle(root, 'tasks.json');
  let nested = null, sub = null;
  try{
    sub = await root.getDirectoryHandle('.harness');
    nested = await fileFromHandle(sub, 'tasks.json');
  }catch(e){}
  let dir = null, tasks = null;
  if(root.name === '.harness' && direct){ dir = root; tasks = direct; }
  else if(nested){ dir = sub; tasks = nested; }
  else if(direct){ dir = root; tasks = direct; }
  if(!dir || tasks == null) return null;
  dirHandle = dir;
  const texts = {'tasks.json': tasks};
  for(const n of optional){
    const text = await fileFromHandle(dir, n);
    if(text !== null) texts[n] = text;
  }
  return texts;
}
async function pickAndRead(){
  if(isTauri()){
    const picked = await window.__TAURI__.core.invoke('pick_harness_dir');
    if(!picked) return {cancelled:true};
    const payload = await window.__TAURI__.core.invoke('read_harness', {path: picked});
    rememberPath(payload.path);
    dirHandle = null;
    return {texts: payload.files};
  }
  if(typeof window.showDirectoryPicker === 'function'){
    const handle = await window.showDirectoryPicker({mode:'read'});
    const texts = await readFromHandle(handle);
    if(!texts) throw Error('该目录没有 tasks.json（可选 .harness 或项目根）');
    rememberPath(handle.name);
    return {texts};
  }
  if(isLocalFile()) throw Error(localFileHint());
  const texts = await fetchHarness();
  rememberPath('');
  return {texts: texts, via:'http'};
}
async function rereadSelected(){
  if(isTauri() && selectedPath){
    const payload = await window.__TAURI__.core.invoke('read_harness', {path: selectedPath});
    rememberPath(payload.path);
    return payload.files;
  }
  if(dirHandle){
    const texts = await readFromHandle(dirHandle);
    if(!texts) throw Error('已选目录里找不到 tasks.json');
    return texts;
  }
  if(!isLocalFile()) return await fetchHarness();
  throw Error('尚未选择项目任务目录');
}
async function loadProject(){ await guarded(async()=>{
  try{
    const result = await pickAndRead();
    if(result.cancelled){ status('已取消选择目录'); return; }
    if(!result.texts){ showEmpty('该目录尚未编排任务'); return; }
    const label = result.via === 'http' ? '已载入当前项目任务' : ('已载入 ' + (selectedPath || '任务目录'));
    install(result.texts, label);
  }catch(e){
    if(e && e.name === 'AbortError'){ status('已取消选择目录'); return; }
    throw e;
  }
});}
async function refreshProject(){ await guarded(async()=>{
  try{
    const texts = await rereadSelected();
    if(!texts){
      if(model.tasks.tasks.length){ status('刷新失败：未找到 tasks.json，已保留上次任务', true); return; }
      showEmpty('尚未编排任务');
      return;
    }
    install(texts, '已刷新 ' + (selectedPath || '任务目录'));
  }catch(e){ status('刷新失败：' + e.message + '，已保留上次任务', true); }
});}
function legacyCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.position = 'absolute';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  ta.remove();
  return ok;
}
async function copyCmd(){
  if(!heroCmd) return;
  let ok = false, err = null;
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(heroCmd); ok = true; }
  }catch(e){ err = e; }
  if(!ok){
    try{ ok = legacyCopy(heroCmd); }catch(e){ err = err || e; }
  }
  if(ok) flash('已复制验证命令');
  else status('复制失败：' + ((err && err.message) || '浏览器拒绝访问剪贴板'), true);
}
$('load').onclick = loadProject;
$('refresh').onclick = refreshProject;
$('copy').onclick = copyCmd;
$('search').addEventListener('input', render);
$('sort').addEventListener('change', e=>{ sortBy = e.target.value; render(); });
$('rail-nav').addEventListener('click', e=>{
  const b = e.target.closest ? e.target.closest('[data-filter]') : null;
  if(!b) return;
  filter = b.dataset.filter;
  render();
});
$('filter-chip').addEventListener('click', e=>{
  const b = e.target.closest ? e.target.closest('[data-filter]') : null;
  if(!b) return;
  filter = b.dataset.filter;
  render();
});
function pickRow(e){
  const item = e.target && e.target.closest ? e.target.closest('[data-i]') : null;
  if(!item) return;
  selected = Number(item.dataset.i);
  render();
}
$('view-tabs').addEventListener('click', e=>{
  const b = e.target.closest ? e.target.closest('[data-tab]') : null;
  if(!b) return;
  setTab(b.dataset.tab);
});
$('tasks').addEventListener('click', pickRow);
$('gantt').addEventListener('click', pickRow);
const evOpen = $('events-open'), evClose = $('events-close'), evDrawer = $('events-drawer');
if(evOpen) evOpen.addEventListener('click', openEvents);
if(evClose) evClose.addEventListener('click', closeEvents);
if(evDrawer) evDrawer.addEventListener('click', e=>{
  const t = e.target;
  if(t && t.getAttribute && t.getAttribute('data-close-drawer')) closeEvents();
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){ closeEvents(); }
  if(e.target && e.target.matches && e.target.matches('input,select,textarea')) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === 'l' || e.key === 'L'){ e.preventDefault(); loadProject(); }
  if(e.key === 'r' || e.key === 'R'){ e.preventDefault(); refreshProject(); }
  if(e.key === 'j' || e.key === 'J' || e.key === 'ArrowDown'){ e.preventDefault(); selected++; render(); }
  if(e.key === 'k' || e.key === 'K' || e.key === 'ArrowUp'){ e.preventDefault(); selected = Math.max(0, selected - 1); render(); }
  if(e.key === '/'){ e.preventDefault(); $('search').focus(); }
});
render();
setDirLabel('');
if(isTauri()){
  let last = '';
  try{ last = localStorage.getItem('task-harness.lastDir') || ''; }catch(e){}
  if(last){ selectedPath = last; setDirLabel(last); refreshProject(); }
  else status('选择项目任务目录（载入任务 / L）');
}else if(isLocalFile()){
  status(localFileHint(), !canPickDir());
}else{
  guarded(async()=>{
    const texts = await fetchHarness();
    if(!texts){ showEmpty('尚未编排任务'); return; }
    install(texts, '已载入当前项目任务');
  });
}
</script>
