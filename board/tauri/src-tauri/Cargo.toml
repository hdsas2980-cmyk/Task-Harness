[package]
name = "task-board"
version = "1.0.0"
description = "Task Harness read-only desktop board"
authors = ["Task Harness"]
edition = "2021"
default-run = "TaskBoard"

[lib]
name = "task_board"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "TaskBoard"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
regex = "1"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", default-features = true }
tiny_http = "0.12"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
